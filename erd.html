<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory_Team — Per-Module Architecture Diagram (Short Bond Extra-Large Print)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Top Toolbar */
    .toolbar {
      position: fixed;
      top: 12px;
      left: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toolbar.hidden-ui {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px);
    }

    .toolbar-title h1 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .toolbar-title p {
      font-size: 12px;
      color: #64748b;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .btn-success {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }

    .btn-success:hover {
      background: #15803d;
      border-color: #15803d;
      color: #ffffff;
    }

    select.layout-select {
      padding: 7px 11px;
      font-size: 12.5px;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
    }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }

    .zoom-group button {
      border: none;
      background: transparent;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }

    .zoom-group button:hover {
      background: #f1f5f9;
    }

    .zoom-label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      padding: 0 10px;
      min-width: 52px;
      text-align: center;
      border-left: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
    }

    #showUiBtn {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 101;
      display: none;
      opacity: 0.6;
    }

    #showUiBtn:hover {
      opacity: 1;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      background: #0f172a;
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Interactive Viewport */
    #viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
    }

    #viewport:active {
      cursor: grabbing;
    }

    /* Short Bond Paper Sheet Container */
    #paperSheet {
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #ffffff;
      box-shadow: 0 0 0 1px #e2e8f0, 0 12px 36px rgba(15, 23, 42, 0.08);
    }

    #paperSheet svg {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }

    @media print {
      @page {
        size: 8.5in 11in;
        margin: 0.18in;
      }
      html, body, #viewport {
        background: #ffffff !important;
        overflow: visible !important;
      }
      .toolbar, #showUiBtn, #toast {
        display: none !important;
      }
      #paperSheet {
        transform: none !important;
        position: static !important;
        width: 100% !important;
        height: auto !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

  <!-- Top Controls Toolbar -->

      <h1>Per-Module Architecture Diagram — Short Bond Paper (Extra-Large Print Edition)</h1>
      <p>Maximum-sized bold letters (21px&ndash;30px) with zero file paths for effortless reading when printed</p>
    </div>

    <div class="toolbar-actions">
      <label for="orientationSelect" style="font-size: 12px; font-weight: 600; color: #475569;">Paper Layout:</label>
      <select id="orientationSelect" class="layout-select" onchange="switchOrientation(this.value)">

        <option value="landscape">Short Bond Landscape (11" &times; 8.5")</option>
      </select>

      <div class="zoom-group">
        <button type="button" onclick="zoomBy(-0.12)" title="Zoom Out">&minus;</button>
        <span id="zoomDisplay" class="zoom-label">100%</span>
        <button type="button" onclick="zoomBy(0.12)" title="Zoom In">&plus;</button>
      </div>

      <button type="button" class="btn" onclick="fitToScreen()">Fit Bond Page</button>
      <button type="button" class="btn btn-success" onclick="copyImageToClipboard()">Copy Image (Ctrl+V in WPS)</button>
      <button type="button" class="btn btn-primary" onclick="downloadPNG()">Download Short Bond PNG</button>
      <button type="button" class="btn" onclick="window.print()">Print Page</button>
      <button type="button" class="btn" onclick="toggleUI(false)">Hide Toolbar</button>
    </div>
  </header>

  <button id="showUiBtn" class="btn" onclick="toggleUI(true)">Show Toolbar</button>
  <div id="toast"></div>

  <main id="viewport">

    let currentOrientation = 'portrait';
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const viewport = document.getElementById('viewport');
    const paperSheet = document.getElementById('paperSheet');
    const zoomDisplay = document.getElementById('zoomDisplay');

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function switchOrientation(mode) {
      currentOrientation = mode;
      if (mode === 'portrait') {
        paperSheet.style.width = '1275px';
        paperSheet.style.height = '1650px';
        paperSheet.innerHTML = PORTRAIT_SVG;
      } else {
        paperSheet.style.width = '1650px';
        paperSheet.style.height = '1275px';
        paperSheet.innerHTML = LANDSCAPE_SVG;
      }
      requestAnimationFrame(() => fitToScreen());
    }

    function updateTransform() {
      paperSheet.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomDisplay.textContent = `${Math.round(scale * 100)}%`;
    }

    function fitToScreen() {
      const naturalW = currentOrientation === 'portrait' ? 1275 : 1650;
      const naturalH = currentOrientation === 'portrait' ? 1650 : 1275;

      const toolbarHidden = document.getElementById('mainToolbar').classList.contains('hidden-ui');
      const topOffset = toolbarHidden ? 20 : 76;
      const availW = window.innerWidth - 40;
      const availH = window.innerHeight - topOffset - 24;

      scale = Math.min(availW / naturalW, availH / naturalH, 1.15);
      scale = Math.max(0.2, scale);

      panX = (window.innerWidth - naturalW * scale) / 2;
      panY = topOffset + Math.max(0, (availH - naturalH * scale) / 2);

      updateTransform();
    }

    function zoomBy(delta) {
      const prevScale = scale;
      scale = Math.min(Math.max(0.2, scale + delta), 2.5);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      panX = cx - (cx - panX) * (scale / prevScale);
      panY = cy - (cy - panY) * (scale / prevScale);

      updateTransform();
    }

    function toggleUI(show) {
      const toolbar = document.getElementById('mainToolbar');
      const showBtn = document.getElementById('showUiBtn');
      if (show) {
        toolbar.classList.remove('hidden-ui');
        showBtn.style.display = 'none';
      } else {
        toolbar.classList.add('hidden-ui');
        showBtn.style.display = 'inline-flex';
      }
      fitToScreen();
    }

    // Pan & Zoom Events
    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const prevScale = scale;
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.2, scale * factor), 2.5);

      panX = e.clientX - (e.clientX - panX) * (scale / prevScale);
      panY = e.clientY - (e.clientY - panY) * (scale / prevScale);
      updateTransform();
    }, { passive: false });

    window.addEventListener('resize', () => fitToScreen());

    // Build 300-DPI Short Bond Paper Canvas (2550 x 3300 px Portrait or 3300 x 2550 px Landscape)
    function buildShortBondCanvas(callback) {
      const svgEl = paperSheet.querySelector('svg');
      if (!svgEl) return;

      const w = currentOrientation === 'portrait' ? 1275 : 1650;
      const h = currentOrientation === 'portrait' ? 1650 : 1275;

      const svgString = new XMLSerializer().serializeToString(svgEl);
      const encodedData = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));

      const img = new Image();
      img.onload = function () {
        const scaleFactor = 2; // 2x = 2550x3300 (Exact 300 DPI for 8.5" x 11" Short Bond Paper!)
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = w * scaleFactor;
        exportCanvas.height = h * scaleFactor;

        const ctx = exportCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
        ctx.scale(scaleFactor, scaleFactor);
        ctx.drawImage(img, 0, 0, w, h);

        callback(exportCanvas);
      };
      img.src = encodedData;
    }

    function downloadPNG() {
      buildShortBondCanvas((exportCanvas) => {
        const pngUrl = exportCanvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = `inventory_team_architecture_short_bond_${currentOrientation}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast(`Downloaded Short Bond (${currentOrientation}) 300-DPI PNG!`);
      });
    }

    function copyImageToClipboard() {
      buildShortBondCanvas((exportCanvas) => {
        exportCanvas.toBlob(async (blob) => {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);
            showToast('Copied Short Bond image! Open WPS Docs and press Ctrl + V.');
          } catch (err) {
            downloadPNG();
          }
        }, 'image/png');
      });
    }

    // Initialize in Short Bond Portrait (8.5" x 11")
    switchOrientation('portrait');
  </script>
