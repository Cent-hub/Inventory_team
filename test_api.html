<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory API Test Console</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0F172A; color: #E2E8F0; padding: 30px; margin: 0; }
        .container { max-width: 760px; margin: 0 auto; background: #1E293B; border-radius: 12px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #38BDF8; font-size: 22px; }
        label { display: block; font-weight: 600; font-size: 13px; margin: 16px 0 6px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input, textarea { width: 100%; box-sizing: border-box; background: #0F172A; border: 1px solid #334155; border-radius: 6px; color: #F8FAFC; padding: 10px 12px; font-size: 14px; font-family: inherit; }
        textarea { font-family: monospace; font-size: 13px; height: 160px; }
        button { background: #0284C7; color: white; border: none; font-size: 15px; font-weight: 600; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; transition: background 0.2s; }
        button:hover { background: #0369A1; }
        .res-box { margin-top: 24px; background: #0A0F1D; border: 1px solid #334155; border-radius: 6px; padding: 16px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 80px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
        .badge-post { background: #0369A1; color: #E0F2FE; }
    </style>
</head>
<body>
<div class="container">
    <h1>StockPilot &mdash; API Test Console</h1>
    <p style="color: #94A3B8; font-size: 14px;">Simulate incoming transactions from Procurement, Production, and Sales without external network connections.</p>

    <label>Endpoint</label>
    <div style="display: flex; gap: 8px;">
        <span class="badge badge-post" style="display: flex; align-items: center;">POST</span>
        <select id="endpointSelect" onchange="onEndpointChange()">
            <option value="stock_in">/api/stock_in/create.php (Stock In — Procurement)</option>
            <option value="stock_out">/api/stock_out/create.php (Stock Out — Sales / Production)</option>
        </select>
    </div>

    <label>Bearer Token</label>
    <input type="text" id="tokenInput" value="proc_live_sec_884121">

    <label>Request JSON Payload</label>
    <textarea id="payloadInput"></textarea>

    <button onclick="sendRequest()">Send Test Request</button>

    <label>Response Output</label>
    <div id="responseBox" class="res-box">Click "Send Test Request" above to view live API response...</div>
</div>

<script>
const payloads = {
    stock_in: {
        token: 'proc_live_sec_884121',
        data: {
            warehouse_id: 1,
            source_type: 'PURCHASE_ORDER',
            source_reference_no: 'PO-TEST-001',
            remarks: 'Simulated delivery from Procurement',
            items: [
                { item_id: 1, quantity: 100 }
            ]
        }
    },
    stock_out: {
        token: 'sales_live_sec_662845',
        data: {
            warehouse_id: 1,
            source_type: 'SALES_DELIVERY',
            source_reference_no: 'SO-TEST-001',
            remarks: 'Simulated dispatch for Sales Order',
            items: [
                { item_id: 1, quantity: 20 }
            ]
        }
    }
};

function onEndpointChange() {
    const selected = document.getElementById('endpointSelect').value;
    document.getElementById('tokenInput').value = payloads[selected].token;
    document.getElementById('payloadInput').value = JSON.stringify(payloads[selected].data, null, 2);
}

onEndpointChange();

async function sendRequest() {
    const selected = document.getElementById('endpointSelect').value;
    const url = 'http://localhost/Inventory_Team/api/' + selected + '/create.php';
    const token = document.getElementById('tokenInput').value.trim();
    const bodyStr = document.getElementById('payloadInput').value.trim();
    const resBox = document.getElementById('responseBox');

    resBox.textContent = 'Sending request to ' + url + '...';

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: bodyStr
        });

        const data = await response.json();
        resBox.textContent = 'Status: ' + response.status + ' ' + response.statusText + '\n\n' + JSON.stringify(data, null, 2);
    } catch (err) {
        resBox.textContent = 'Network / Request Error:\n' + err.message;
    }
}
</script>
</body>
</html>
